name: scene_split
description: "Split expenses with friends, track balances, and settle up — offline-first Flutter app with local SQLite storage."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Database
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.3.4

  # Backup
  file_picker: ^12.0.0-beta.7
  share_plus: ^13.2.0

  # UUID
  uuid: ^4.5.3

  # Routing
  go_router: ^17.3.0

  # UI
  flutter_markdown_plus: ^1.0.11
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.9

  # Utils
  collection: ^1.19.1
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/legal/
