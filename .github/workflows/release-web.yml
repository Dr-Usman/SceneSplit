name: Release Web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Verify pubspec version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        uses: ./.github/actions/release-notes

      - name: Verify Drift web assets are present
        run: |
          test -f web/sqlite3.wasm
          test -f web/drift_worker.js

      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run

      - name: Package web bundle
        run: |
          cd build/web
          zip -r ../../scene-split-web.zip .

      - name: Upload web bundle to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            scene-split-web.zip
